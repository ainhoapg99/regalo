<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Un regalo para ti, mamá</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Playfair+Display:ital,wght@0,600;1,500&family=Poppins:wght@400;500;600;700&family=Space+Mono:wght@700&display=swap">
<style>
  :root { --cream:#FBF5EA; --ink:#3B2A24; --terra:#C9785D; --gold:#C9A45C; --pink:#E8388C; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; }
  body { background: radial-gradient(circle at 50% 20%, #FFF8EE 0%, #F3E4D2 60%, #E9D3BC 100%); color:var(--ink);
         font-family:'Poppins',sans-serif; display:flex; justify-content:center; min-height:100vh; overflow-x:hidden; }
  body.open { background:#17121A; color:#FBF5EA; transition: background 1.2s; }
  .card { width:min(94vw,460px); text-align:center; padding:40px 14px 50px; }
  h1 { font-family:'Playfair Display',serif; font-style:italic; font-weight:500; font-size:34px; margin:12px 0 6px; }
  .hand { font-family:'Caveat',cursive; font-size:26px; color:var(--terra); margin:0 0 22px; }
  body.open .hand { color:#F3B9A6; }
  .lock { width:120px; height:120px; margin:30px auto 0; transition: transform .6s cubic-bezier(.3,1.6,.5,1); }
  .lock.shake { animation: shake .5s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-10px) rotate(-6deg)} 40%{transform:translateX(10px) rotate(6deg)} 60%{transform:translateX(-7px)} 80%{transform:translateX(7px)} }
  form { display:flex; flex-direction:column; gap:12px; margin-top:6px; }
  input { font-family:'Poppins',sans-serif; font-size:22px; text-align:center; letter-spacing:4px; padding:14px; border-radius:16px;
          border:2px solid var(--gold); background:#fff; color:var(--ink); outline:none; text-transform:uppercase; }
  input:focus { border-color:var(--terra); box-shadow:0 0 0 4px rgba(201,120,93,.18); }
  button { font-family:'Poppins',sans-serif; font-weight:600; font-size:18px; padding:14px; border:none; border-radius:16px;
           background:var(--terra); color:#fff; cursor:pointer; box-shadow:0 6px 16px rgba(201,120,93,.35); }
  .msg { min-height:28px; font-family:'Caveat',cursive; font-size:24px; color:var(--terra); margin-top:10px; }
  #reveal { display:none; }
  .big { font-family:'Playfair Display',serif; font-style:italic; font-size:32px; margin:4px 0 6px; line-height:1.15; }
  /* entrada */
  .tk { position:relative; margin:22px auto; background:#0E0D10; color:#fff; border-radius:26px; overflow:hidden; text-align:left;
        box-shadow:0 18px 40px rgba(0,0,0,.45); opacity:0; transform:translateY(80px) rotate(var(--r,-3deg)) scale(.92); }
  .tk.show { animation: tin 1.1s cubic-bezier(.2,1.35,.4,1) forwards; }
  .tk:nth-child(2).show { animation-delay:.4s; }
  @keyframes tin { to { opacity:1; transform:translateY(0) rotate(var(--r2,0deg)) scale(1); } }
  .tk-head { display:flex; justify-content:space-between; align-items:center; padding:18px 20px 14px; gap:10px; }
  .tk-gift { font-weight:700; font-size:15px; line-height:1.1; }
  .tk-gift span { display:block; font-family:'Caveat',cursive; font-weight:700; font-size:26px; color:#F3B9A6; }
  .tk-right { text-align:right; font-family:'Space Mono',monospace; font-size:14px; line-height:1.25; }
  .tk-right b { color:var(--pink); display:block; font-size:16px; }
  .tk-photo { position:relative; height:190px; background-size:cover; background-position:center; }
  .tk-photo::after { content:""; position:absolute; inset:0; background:linear-gradient(90deg, rgba(251,245,234,.55), rgba(251,245,234,0) 60%); }
  .tk-tour { position:absolute; left:18px; top:22px; z-index:1; font-family:'Caveat',cursive; font-weight:700; font-size:34px; line-height:.95; color:#5A3A1E; transform:rotate(-4deg); }
  .tk-body { padding:16px 20px 18px; }
  .lbl { font-family:'Space Mono',monospace; font-size:12.5px; color:var(--pink); letter-spacing:.5px; }
  .val { font-weight:500; font-size:16px; margin:2px 0 14px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; column-gap:14px; }
  .grid .val { font-size:17px; font-weight:600; }
  .tk-cut { position:relative; border-top:2px dashed rgba(255,255,255,.25); margin:4px 0 0; }
  .tk-cut::before, .tk-cut::after { content:""; position:absolute; top:-14px; width:26px; height:26px; border-radius:50%; background:#17121A; }
  .tk-cut::before { left:-33px; } .tk-cut::after { right:-33px; }
  .tk-foot { display:flex; justify-content:space-between; align-items:center; padding:14px 20px 18px; font-family:'Space Mono',monospace; font-size:12px; color:#bbb; }
  .tk-foot .heart { font-size:30px; color:var(--pink); }
  .note { font-family:'Caveat',cursive; font-size:28px; line-height:1.25; margin:22px 6px 0; }
  .sign { font-family:'Caveat',cursive; font-size:30px; color:#F3B9A6; margin-top:8px; }
  #player { margin-top:8px; border-radius:14px; overflow:hidden; }
  #playbtn { display:none; margin-top:10px; background:var(--pink); box-shadow:0 6px 18px rgba(232,56,140,.45); }
  canvas { position:fixed; inset:0; pointer-events:none; width:100vw; height:100vh; z-index:5; }
</style>
<script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
</head>
<body>
<canvas id="fx"></canvas>
<main class="card">
  <section id="gate">
    <svg class="lock" id="lock" viewBox="0 0 120 120" aria-hidden="true">
      <path d="M38 54 V40 a22 22 0 0 1 44 0 V54" fill="none" stroke="#3B2A24" stroke-width="8" stroke-linecap="round" id="shackle"/>
      <rect x="26" y="52" width="68" height="56" rx="12" fill="#C9785D"/>
      <circle cx="60" cy="76" r="8" fill="#FBF5EA"/><rect x="56" y="80" width="8" height="16" rx="3" fill="#FBF5EA"/>
    </svg>
    <h1>Un regalo para ti, mamá</h1>
    <p class="hand">Está cerrado con contraseña… y Ainhoa la tiene 😉</p>
    <form id="f" autocomplete="off">
      <input id="pw" placeholder="CONTRASEÑA" aria-label="Contraseña" autocapitalize="characters" spellcheck="false">
      <button type="submit">Abrir mi regalo</button>
    </form>
    <div class="msg" id="msg"></div>
  </section>
  <section id="reveal" aria-live="polite">
    <div class="big" id="r-title"></div>
    <div class="hand" id="r-sub" style="margin-bottom:4px"></div>
    <div class="hand" id="r-music-txt" style="margin:18px 0 6px"></div>
    <div id="player"></div>
    <button id="playbtn" type="button">▶ Escuchar</button>
    <div id="tickets"></div>
    <p class="note" id="r-msg"></p>
    <p class="sign" id="r-sign"></p>
  </section>
</main>

let SP = null, CTRL = null;
window.onSpotifyIframeApiReady = (api) => { SP = api; };
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z0-9]/g, '');
async function decrypt(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(ENC.salt), iterations:150000, hash:'SHA-256'},
                                            base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(ENC.iv)}, key, b64(ENC.ct))));
}
function chime() {
  try { const ac = new (window.AudioContext || window.webkitAudioContext)();
    [784, 988, 1175, 1568].forEach((f, i) => { const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.value = f; g.gain.setValueAtTime(0, ac.currentTime + i * .12);
      g.gain.linearRampToValueAtTime(.16, ac.currentTime + i * .12 + .02);
      g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + i * .12 + 1.3);
      o.connect(g).connect(ac.destination); o.start(ac.currentTime + i * .12); o.stop(ac.currentTime + i * .12 + 1.4); });
  } catch (e) {}
}
function confetti() {
  const c = document.getElementById('fx'), x = c.getContext('2d'), dpr = window.devicePixelRatio || 1;
  c.width = innerWidth * dpr; c.height = innerHeight * dpr; x.scale(dpr, dpr);
  const cols = ['#E8388C','#C9A45C','#F3B9A6','#FBF5EA','#C9785D'];
  const P = Array.from({length:170}, () => ({x:Math.random()*innerWidth, y:-20-Math.random()*innerHeight*.7, vy:2+Math.random()*3,
    vx:-1+Math.random()*2, r:Math.random()*6.28, vr:-.2+Math.random()*.4, s:6+Math.random()*9, c:cols[Math.floor(Math.random()*5)]}));
  const t0 = performance.now();
  (function loop(now) { x.clearRect(0, 0, innerWidth, innerHeight);
    P.forEach(p => { p.x += p.vx; p.y += p.vy; p.r += p.vr; x.save(); x.translate(p.x, p.y); x.rotate(p.r);
      x.fillStyle = p.c; x.fillRect(-p.s/2, -p.s/4, p.s, p.s/2); x.restore(); });
    if (now - t0 < 8000) requestAnimationFrame(loop); else x.clearRect(0, 0, innerWidth, innerHeight); })(t0);
}
function el(tag, cls, txt) { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
function ticket(d, i) {
  const t = el('div', 'tk'); t.style.setProperty('--r', i ? '4deg' : '-4deg'); t.style.setProperty('--r2', i ? '1deg' : '-1deg');
  const head = el('div', 'tk-head');
  const g = el('div', 'tk-gift', 'Regalo de'); g.appendChild(el('span', null, 'cumpleaños ♥')); head.appendChild(g);
  const r = el('div', 'tk-right'); r.appendChild(el('b', null, d.artista)); r.appendChild(el('div', null, d.fecha_corta)); head.appendChild(r);
  t.appendChild(head);
  const ph = el('div', 'tk-photo'); ph.style.backgroundImage = 'url(' + d.fotos[i] + ')';
  ph.appendChild(el('div', 'tk-tour', d.gira)); t.appendChild(ph);
  const body = el('div', 'tk-body');
  body.appendChild(el('div', 'lbl', d.recinto)); body.appendChild(el('div', 'val', d.evento));
  const grid = el('div', 'grid');
  [['TARIFA', d.tarifa], ['APERTURA DE PUERTAS', d.puertas], ['SECTOR', d.sector], ['PARA', d.para[i]]].forEach(([a, b]) => {
    const c = el('div'); c.appendChild(el('div', 'lbl', a)); c.appendChild(el('div', 'val', b)); grid.appendChild(c); });
  body.appendChild(grid); t.appendChild(body);
  t.appendChild(el('div', 'tk-cut'));
  const foot = el('div', 'tk-foot'); foot.appendChild(el('div', null, 'ENTRADA ' + (i + 1) + ' DE 2'));
  foot.appendChild(el('div', 'heart', '♥')); t.appendChild(foot);
  return t;
}
function music(d) {
  document.getElementById('r-music-txt').textContent = d.musica_txt;
  const holder = document.getElementById('player'), btn = document.getElementById('playbtn');
  const start = () => {
    if (!SP) return setTimeout(start, 300);
    const div = document.createElement('div'); holder.appendChild(div);
    SP.createController(div, {uri: d.uri, width: '100%', height: 152}, (c) => {
      CTRL = c;
      c.addListener('ready', () => { try { c.play(); } catch (e) {} });
      c.addListener('playback_update', (e) => { if (e.data && !e.data.isPaused) btn.style.display = 'none'; });
      setTimeout(() => { btn.style.display = 'inline-block'; }, 2500);
    });
  };
  btn.onclick = () => { try { CTRL && CTRL.togglePlay ? CTRL.togglePlay() : CTRL.play(); } catch (e) {} };
  start();
}
document.getElementById('f').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const msg = document.getElementById('msg'), lock = document.getElementById('lock');
  msg.textContent = 'Abriendo…';
  try {
    const d = await decrypt(norm(document.getElementById('pw').value));
    chime();
    document.getElementById('shackle').setAttribute('d', 'M38 54 V40 a22 22 0 0 1 44 0 V30');
    lock.style.transform = 'scale(1.15) rotate(-8deg)';
    music(d);
    setTimeout(() => {
      document.body.classList.add('open');
      document.getElementById('gate').style.display = 'none';
      document.getElementById('reveal').style.display = 'block';
      document.getElementById('r-title').textContent = d.titulo;
      document.getElementById('r-sub').textContent = d.sub;
      const tk = document.getElementById('tickets');
      [0, 1].forEach(i => tk.appendChild(ticket(d, i)));
      requestAnimationFrame(() => tk.querySelectorAll('.tk').forEach(t => t.classList.add('show')));
      document.getElementById('r-msg').textContent = d.mensaje;
      document.getElementById('r-sign').textContent = d.firma + ' ❤️';
      confetti();
    }, 700);
  } catch (e) {
    msg.textContent = 'Esa no es… ¡pregúntale a Ainhoa! 😉';
    lock.classList.remove('shake'); void lock.offsetWidth; lock.classList.add('shake');
  }
});
